# tmux 3.2+. Custom Ctrl+a key layout; no plugins or account settings.
set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
setw -g mode-keys vi
set -g status-left "[#S] "
set -g status-right "%H:%M"
set -g status-interval 10

# Reviewed custom keybindings. Clipboard selection uses the tmux buffer.
unbind "\$"       # default: rename-session
unbind ,          # default: rename-window
unbind %          # default: split-window -h
unbind '"'        # default: split-window -v
unbind "'"        # default: select-window by index
unbind l          # default: last-window (we use l for pane-right)
unbind M-n        # default: next window with alert
unbind M-p        # default: previous window with alert
unbind o          # default: rotate panes
unbind &          # default: kill-window (no confirm)
unbind "#"        # default: list-buffer
unbind =          # default: choose-buffer
unbind M-Up       # default: resize 5 rows up
unbind M-Down     # default: resize 5 rows down
unbind M-Right    # default: resize 5 cols right
unbind M-Left     # default: resize 5 cols left
unbind ]          # default: paste-buffer
unbind -T copy-mode-vi Enter
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind P paste-buffer                               # prefix + P to paste from tmux buffer
bind -T copy-mode-vi v send-keys -X begin-selection        # v = visual select
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle     # C-v = block select
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel            # Esc = exit copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind C-r source-file ~/.tmux.conf\; display "Reloaded!"    # C-r = reload config
bind r command-prompt -I "#{window_name}" "rename-window '%%'"    # r = rename window
bind R command-prompt -I "#{session_name}" "rename-session '%%'"  # R = rename session
bind c new-window -c "#{pane_current_path}"
unbind -n C-c
bind p kill-pane                                                  # fast — single pane, low risk
bind x confirm-before -p "kill window #W? (y/n)" kill-window      # confirm — kills all panes in window
bind X confirm-before -p "kill session #S? (y/n)" kill-session     # confirm — nukes the whole session
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind C-h previous-window                          # prefix + C-h = previous window
bind C-l next-window                              # prefix + C-l = next window
bind -r "<" swap-window -d -t -1                  # prefix + < = move window left
bind -r ">" swap-window -d -t +1                  # prefix + > = move window right
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H swap-window -d -t -1
bind -r L swap-window -d -t +1
bind b break-pane -d                              # detach pane into its own window
bind S set-window-option synchronize-panes\; display-message "synchronize mode toggled"
bind w choose-session                             # visual session/window picker
bind N switch-client -n                           # cycle to next session
bind B switch-client -p                           # cycle to previous session (B = back)
