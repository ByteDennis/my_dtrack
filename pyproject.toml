[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtrack"
version = "0.1.0"
description = "S3-coordinated two-stage data reconciliation"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "oracledb>=3.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.67",
    "ipdb>=0.13",
    "debugpy>=1.8",
]

[project.optional-dependencies]
athena = ["pyathena>=2.0"]
confluence = ["atlassian-python-api==5.0.5"]
hadoop = ["impyla>=0.19", "thrift-sasl>=0.4", "pure-sasl>=0.6"]
ldap = ["ldap3>=2.9"]
dbx = ["databricks-sdk>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4,<2.5",
    "databricks-sdk>=0.143.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "moto[s3]>=5",
    "testcontainers>=4",
]
spark = ["pyspark>=3.5,<4"]
live = [
    "databricks-sdk>=0.40",
    "databricks-connect>=16.4 ; python_version == '3.12'",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "spark" }, { group = "live" }]]

[project.scripts]
dtrack = "dtrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtrack_left", "src/dtrack", "src/dtrack_right", "src/dtrack_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: unit tests that exercise a full pipeline or another intentionally expensive path",
    "moto: tests/local/s3, needs the Moto S3 container (run with --run-moto)",
    "spark: tests/local/spark, local pyspark session (run with --run-spark)",
    "oracle: tests/local/oracle, Oracle via testcontainers (run with --run-oracle)",
    "e2e: tests/local/e2e, runs examples/e2e/run_e2e.sh (run with --run-e2e)",
    "live: tests/live, real AWS S3 and Databricks (run with --run-live)",
    "confluence: tests/local/confluence, local Confluence DC 9.2 (just confluence up; run with --run-confluence)",
    "docker: needs a local Docker daemon; skipped when none is reachable (select with -m 'not docker')",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/dtrack_right/notebook.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/dtrack_right/notebook.py"]

[tool.ruff.lint.per-file-ignores]
"src/dtrack_right/**/*.py" = ["BLE001"]
"src/dtrack_left/cli/tools.py" = ["T100"]
"src/dtrack_left/cli/debugging.py" = ["T100"]
"src/dtrack_left/backends/*.py" = ["BLE001"]
