[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtrack-distributed"
version = "0.1.0"
description = "S3-coordinated two-stage data reconciliation"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "databricks-sdk>=0.18",
    "databricks-sql-connector>=3.0",
    "oracledb>=3.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
athena = ["pyathena>=2.0"]
hadoop = ["impyla>=0.19", "thrift-sasl>=0.4", "pure-sasl>=0.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
dtrack-distributed = "dtrack_distributed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtrack_distributed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local container-backed integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
