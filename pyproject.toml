[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pair-recon"
version = "0.1.0"
description = "Oracle and Databricks table-pair reconciliation"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.143.0",
    "duckdb>=1.1",
    "oracledb>=3.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pywin32>=312; sys_platform == 'win32'",
    "tqdm>=4.67",
    "tzlocal>=5.3",
]

[project.optional-dependencies]
debug = ["debugpy>=1.8", "ipdb>=0.13"]
hadoop = ["pyodbc>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4,<2.5",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "testcontainers>=4",
]
spark = ["pyspark>=3.5,<4"]
live = ["databricks-connect>=16.4 ; python_version == '3.12'"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "spark" }, { group = "live" }]]

[project.scripts]
pair_recon = "pair_recon.app.cli:main"
pair_recon_dbx = "pair_recon_dbx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pair_recon", "src/pair_recon_dbx", "src/pair_recon_left", "src/pair_recon_right"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: unit tests that exercise a full pipeline or another intentionally expensive path",
    "spark: tests/local/spark, local pyspark session (run with --run-spark)",
    "oracle: tests/local/oracle, Oracle via testcontainers (run with --run-oracle)",
    "live: tests/live, configured external services (run with --run-live)",
    "live_performance: opt-in external source timing profiles without fixed thresholds",
    "docker: needs a local Docker daemon; skipped when none is reachable (select with -m 'not docker')",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/pair_recon_right/notebook.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/pair_recon_right/notebook.py"]

[tool.ruff.lint.per-file-ignores]
"src/pair_recon_right/**/*.py" = ["BLE001"]
"src/pair_recon_left/backends/*.py" = ["BLE001"]
"src/pair_recon_dbx/workspace.py" = ["BLE001"]
"**/common/model/audit.py" = ["BLE001"]
"**/common/sql/dates.py" = ["DTZ007"]
