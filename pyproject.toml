[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtrack"
version = "0.1.0"
description = "Data tracking CLI for row counts and column statistics"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "python-dotenv>=1.0.1",
    "oracledb>=3.0.0",
    "openpyxl>=3.1.5",
    "pyathena>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.0.0",
    "python-multipart>=0.0.22",
    "ldap3>=2.9",
    "s3fs>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=3.0.0", "ruff"]
debug = ["ipdb>=0.13.0", "debugpy>=1.6.0"]
# Required only when a pair has source=csv. The CSV-as-source mode reads
# CSVs in-process via DuckDB so we can run the same row_gen / col_gen
# pipeline against local files without engine credentials. dtrack as a
# whole works fine without duckdb installed -- the import is lazy
# inside platforms/csv_duckdb.py and surfaces a clear error message
# when the user tries to extract from a csv-source pair without it.
csv = ["duckdb>=0.10.0"]

[project.scripts]
dtrack = "dtrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dtrack"]
