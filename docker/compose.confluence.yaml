services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: confluence
      POSTGRES_DB: confluence
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "confluence"]
      interval: 2s
      timeout: 3s
      retries: 30
  confluence:
    image: atlassian/confluence:${DTRACK_CONFLUENCE_VERSION:-9.2.19}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DTRACK_CONFLUENCE_PORT:-8090}:8090"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: confluence
      ATL_DB_TYPE: postgresql
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
