<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Reconciliation{% if page_title %} - {{ page_title }}{% endif %}</title>
    <link rel="stylesheet" href="/static/style_v2.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Data Reconciliation</h1>
        </div>
        <div class="header-right">
            <select id="step-selector" onchange="navigateToStep(this.value)">
                {% set steps = [
                    ("pairs", "Row Gen"),
                    ("load_row", "Load Row"),
                    ("row_compare", "Row Compare"),
                    ("col_mapping", "Col Mapping"),
                    ("col_gen", "Col Gen"),
                    ("load_col", "Load Col"),
                    ("col_compare", "Col Compare"),
                    ("csv_compare", "CSV Compare"),
                ] %}
                {% for k, label in steps %}
                <option value="{{ k }}"{% if current_page == k %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <a href="/playground" style="text-decoration:none;"><button type="button"{% if current_page == "playground" %} disabled{% endif %}>Playground</button></a>
            <a href="/sync" style="text-decoration:none;"><button type="button"{% if current_page == "sync" %} disabled{% endif %}>Sync</button></a>
            {% block nav_extras %}{% endblock %}
            <!-- Global pair selector indicator. Click to open the picker
                 modal (common.js openGlobalPairPicker). Empty selection is
                 displayed as 'all' (meaning "every pair" -- the default
                 before the user has narrowed). -->
            <button class="btn-text" id="global-pairs-btn"
                    onclick="openGlobalPairPicker()"
                    title="Global pair selection (sticky across pages)">
                Pairs: <span id="global-pairs-badge" style="font-weight:600;">all</span>
            </button>
            <button class="btn-text" id="refresh-db-btn" onclick="refreshDB()" title="Refresh DB schema + metadata">Refresh DB</button>
            <div class="db-status" id="db-status" title="Database connected"></div>
        </div>
    </header>

    {% block io_bar %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}

    <script src="/static/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
